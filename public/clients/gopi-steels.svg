<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80" viewBox="0 0 240 80" role="img" aria-label="Gopi Steels">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- I-beam mark -->
  <g transform="translate(8 14)">
    <rect x="0" y="0" width="44" height="10" rx="2" fill="url(#steel)"/>
    <rect x="16" y="10" width="12" height="32" fill="url(#steel)"/>
    <rect x="0" y="42" width="44" height="10" rx="2" fill="url(#steel)"/>
    <rect x="3" y="2.5" width="38" height="2" rx="1" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- Wordmark -->
  <text x="66" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#1e293b">GOPI</text>
  <text x="67" y="64" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="7.5" fill="#64748b">STEELS</text>
</svg>
